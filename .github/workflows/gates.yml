# ────────────────────────────────────────────────────────────────────────────
# THE GATES, RUN WHERE NOBODY IS LOOKING — CP-3a.
#
# Two halves, one job, deliberately:
#   · PR — every pull request runs the full floor before it can merge, WHATEVER
#     ITS BASE. See the `on:` block for why that last clause is load-bearing.
#   · SCHEDULE — main is re-run daily with no commit involved. This is the half
#     that matters. On 2026-08-01 the floor broke with nobody touching a file
#     (two specs read the real wall clock past a fixture due-date) and was found
#     the following Monday by a session looking at something else. No commit
#     could have caught it, because no commit occurred.
#
# ONE job serves both triggers on purpose. A separate "scheduled" workflow would
# be a second statement of what green means, free to drift from the first.
#
# NO PATH FILTERS, deliberately. A docs-only change is not a safe change here:
# the C9 contract pin READS `docs/contracts/*.md` and fails when the prose and
# the types module disagree. `paths-ignore: docs/**` would have skipped exactly
# the gate that exists to catch that.
# ────────────────────────────────────────────────────────────────────────────

name: gates

# ⚠️ MANUAL ONLY SINCE 2026-10-14. The merge gate moved to GitLab
# (`.gitlab-ci.yml`): GitHub Actions minutes are budget-limited, and this job
# costs ~20–29 min per run. The `pull_request` trigger (every PR, every base,
# including `edited` for retargets) and the daily `schedule` at 00:17 UTC now
# live in GitLab as merge-request and scheduled pipelines. This workflow is
# kept so the gates can still be run here by hand (Actions → gates → Run
# workflow), and so restoring the triggers is a one-block change.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight PR run when the branch is pushed again; never cancel
  # a scheduled or manually dispatched run of main — those are the record.
  group: gates-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: build · floor · test:gate
    runs-on: ubuntu-latest
    # 35, raised from 25 on 2026-10-06: the suite grew to the point where a
    # green run (gates finished at 24m57s on PR #142) was cancelled by the
    # limit during cleanup and reported as a failure.
    timeout-minutes: 35
    steps:
      # @v5 and not @v4: the v4 actions target node 20, which the runners have
      # deprecated and now force onto 24 with a warning. A brand-new workflow
      # should not ship carrying a deprecation notice.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Pinned to the operator's local major (v24.x). CI must not be a
          # different runtime than the one the gates are green on.
          node-version: '24'
          cache: npm

      # `npm ci` and not `npm install`: it fails on a lockfile that has drifted
      # from package.json instead of quietly resolving something else.
      - run: npm ci

      # The same command the operator runs locally. It executes the gates
      # CLAUDE.md names (build, spec typecheck, vitest, test:gate, lint) and asserts the collected counts against
      # scripts/floor.json, so a suite that silently collects less cannot pass.
      - run: npm run gates

      # ── THE DRIFT READER — SCHEDULED HALF ONLY, AND THE `if:` IS THE POINT ──
      # `npm run drift` is the ONE assertion in this tree that reads the real
      # wall clock: it asks whether `DECLARED_PRESENT` has drifted far enough
      # that a surface is showing a stored clock-state which is no longer true.
      # Until it existed, `toleranceDays` was a declared number with no reader
      # and a family could go false with all 4471 tests green — measured on
      # 2026-09-08, when the obligation family had already tipped.
      #
      # ⚠️ IT RUNS ON `schedule` ONLY, AND THAT IS NOT TIMIDITY. It goes red on
      # a CALENDAR DAY with nobody touching a file. In the PR half that reddens
      # every unrelated pull request, and its remedy — moving
      # `MANDATE_LEAD_DAYS`, which re-times every fixture in the tree — is an
      # operator RULING no PR author can take. CP-3a ruled on this exact shape
      # for the floor: a threshold people must routinely edit to go green is not
      # a threshold. The scheduled half exists for a break with no commit
      # involved, which is precisely what clock drift is.
      #
      # It is a step of THIS job, not a second job, so a drift failure flows
      # into the same `report` gate below and files the same issue. A separate
      # workflow would be a second statement of what red means.
      - name: clock drift (scheduled only)
        if: github.event_name == 'schedule'
        run: npm run drift

  # ── The notification path ─────────────────────────────────────────────────
  # A red badge is not a notification: nobody goes to look at a badge on a
  # Saturday. GitHub's own failure email for a scheduled run goes only to the
  # account that last touched the cron, and only if that account has Actions
  # notifications enabled — a setting this repository cannot see or assert.
  # So the scheduled half files an ISSUE, which is durable, visible without
  # going to look, and independent of that setting.
  report:
    name: report a scheduled failure
    needs: gates
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BODY="The scheduled \`gates\` run on \`main\` failed at \`${SHA}\` with no commit involved.

          Run: ${RUN_URL}

          Nothing was pushed. If this is the first failure after a green day, the
          most likely cause is a clock-decaying assertion — a fixture date that
          has crossed the wall clock — not a code change.

          The scheduled run includes \`npm run drift\`, which names the family
          directly: it reports each fixture family's drift from
          \`DECLARED_PRESENT\` beside its declared \`toleranceDays\` and fails
          when a family a reader can still SEE has been falsified. Read that
          step's table first — if it is the failing one, the remedy is an
          operator ruling on \`MANDATE_LEAD_DAYS\`, or computing that family's
          display states the way \`obligationProjection\` does, NOT an edit to
          a test."
          EXISTING=$(gh issue list --state open --label gates-failure --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create gates-failure --color B60205 --description "A scheduled gates run on main failed" 2>/dev/null || true
            gh issue create --title "gates: the scheduled run on main is failing" --label gates-failure --body "$BODY"
          fi
