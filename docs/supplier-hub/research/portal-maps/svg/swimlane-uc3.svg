ont-weight="400" fill="#1b2733">Call-offs · Respond, Confirm as</text><text x="364" y="283" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b2733">requested · Call-off → Confirmed</text><rect x="330" y="307" width="256" height="48" rx="6" fill="#ffffff" stroke="#c9d2db" stroke-width="1.2"/><circle cx="346" cy="324" r="10" fill="#0d1b2a"/><text x="346" y="328" font-size="10.5" text-anchor="middle" font-weight="600" fill="#ffffff">4</text><text x="364" y="328" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b2733">Call-offs · Send dispatch notice</text><text x="364" y="343" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b2733">· Confirmed (dispatched)</text><rect x="338" y="367" width="240" height="40" rx="5" fill="#fff7e0" stroke="#e0b44c" stroke-width="1"/><text x="458" y="383" font-size="11" text-anchor="middle" font-weight="400" fill="#5a4100">no link from the call-off to its ASN,</text><text x="458" y="397" font-size="11" text-anchor="middle" font-weight="400" fill="#5a4100">menu: Shipments &amp; ASN</text><rect x="330" y="419" width="256" height="63" rx="6" fill="#ffffff" stroke="#c9d2db" stroke-width="1.2"/><circle cx="346" cy="436" r="10" fill="#0d1b2a"/><text x="346" y="440" font-size="10.5" text-anchor="middle" font-weight="600" fill="#ffffff">5</text><text x="364" y="440" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b2733">Shipments &amp; ASN · Create the ASN</text><text x="364" y="455" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b2733">for the confirmed call-off · ASN</text><text x="364" y="470" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b2733">→ Submitted</text><path d="M458,532 L162,532" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah-e-back)"/><text x="306" y="506" font-size="11" text-anchor="middle" font-weight="400" font-style="italic" fill="#4a5a6b">My tasks call-off items only for</text><text x="306" y="52